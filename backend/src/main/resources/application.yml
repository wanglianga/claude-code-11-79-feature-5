server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ctrial-sync
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ctrial}
    username: ${DB_USER:ccdev}
    password: ${DB_PASSWORD:ccdev}
    hikari:
      maximum-pool-size: 12
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  demo:
    seed-on-startup: ${DEMO_SEED:true}
  retention:
    restricted-years: 25
    destroy-days: 30

logging:
  level:
    root: INFO
    com.ctrial: INFO
